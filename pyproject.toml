[project]
name = "teste-mlp-fujita-para-fujitafaltante-fujitapos-imputacao"
version = "0.1.0"
description = "Pipeline unificado de treinamento e inferências celulares Fujita (genes faltantes e pós-imputação)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anndata>=0.10.0",
    "cupy-cuda12x>=14.2.0",
    "h5py>=3.10.0",
    "ipykernel>=6.29.0",
    "joblib>=1.3.0",
    "jupyterlab>=4.0.0",
    "keras>=3.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform == 'linux'",
    "nvidia-cuda-nvrtc-cu12>=12.9.86 ; sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12>=12.9.79 ; sys_platform == 'linux'",
    "nvidia-cusparse-cu12>=12.5.10.65 ; sys_platform == 'linux'",
    "nvidia-nvjitlink-cu12>=12.9.86",
    "plotly>=7.1.0",
    "polars>=1.0.0",
    "scikit-learn>=1.6.1,<1.7.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.0",
    "sweep>=2.1.3.0",
    "tensorflow>=2.16.0",
    "umap-learn>=0.5.5",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.uv.sources]
sweep = { url = "https://github.com/rasert/sweep/releases/download/v2.2.0.0-beta.1/sweep-2.2.0.0-py3-none-any.whl" }
