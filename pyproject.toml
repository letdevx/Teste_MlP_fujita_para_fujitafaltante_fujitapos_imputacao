    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "polars>=1.0.0",
    "scikit-learn>=1.6.1,<1.7.0",
    "sqlalchemy>=2.0.0",
    "tensorflow>=2.16.0",
    "umap-learn>=0.5.5",
]
